name: Generate and Rename ZIPs on Thingino Firmware Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Thingino Firmware Release Tag (e.g., firmware-2025-05-20)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-zips:
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: release
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TARGET_TAG="${{ github.event.inputs.release_tag }}"
          else
            TARGET_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/themactep/thingino-firmware/releases/latest | jq -r .tag_name)
            if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "null" ]; then
              echo "Error: Could not fetch the latest release tag from themactep/thingino-firmware."
              exit 1
            fi
          fi
          echo "RELEASE_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "Target tag: $TARGET_TAG"

      - name: Check if release already exists
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/pocho-labs/thingino-firmware-personal/releases/tags/${{ env.RELEASE_TAG }})
          echo "Tag lookup HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Release ${{ env.RELEASE_TAG }} already exists. Nothing to do."
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "New release detected: ${{ env.RELEASE_TAG }}"
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        if: env.SKIP != 'true'
        uses: actions/checkout@v6

      - name: Set up environment
        if: env.SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip jq
          git clone https://github.com/cocus/t31-test-tar-upgrader.git

      - name: Run make to generate ZIP files
        if: env.SKIP != 'true'
        run: |
          cd t31-test-tar-upgrader
          make

      - name: Rename ZIP files
        if: env.SKIP != 'true'
        run: |
          mkdir -p temp_zips
          mv t31-test-tar-upgrader/personalcam2.zip temp_zips/personalcam2-${{ env.RELEASE_TAG }}.zip
          mv t31-test-tar-upgrader/personalpan.zip temp_zips/personalpan-${{ env.RELEASE_TAG }}.zip

      - name: Fetch upstream release notes
        if: env.SKIP != 'true'
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/themactep/thingino-firmware/releases/tags/${{ env.RELEASE_TAG }}")
          RELEASE_NAME=$(echo "$RELEASE_INFO" | jq -r '.name // "No release name"')
          RELEASE_BODY=$(echo "$RELEASE_INFO" | jq -r '.body // "No release notes available"')
          echo "THINGINO_RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "THINGINO_RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            temp_zips/personalcam2-${{ env.RELEASE_TAG }}.zip
            temp_zips/personalpan-${{ env.RELEASE_TAG }}.zip
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: |
            ZIP files generated from cocus/t31-test-tar-upgrader for thingino-firmware release ${{ env.RELEASE_TAG }}.

            **Original thingino-firmware Release Notes**:
            Release Name: ${{ env.THINGINO_RELEASE_NAME }}
            ${{ env.THINGINO_RELEASE_BODY }}

            See the original [thingino release](https://github.com/themactep/thingino-firmware/releases/tag/${{ env.RELEASE_TAG }})
        env:
          GITHUB_TOKEN: ${{ github.token }}
